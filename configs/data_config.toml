# Notebook source: Notebooks/datasets_exploration.ipynb (left unchanged).
# Setup: uv sync --locked
# All reports: uv run python scripts/run_exploration.py
# One report: uv run python -m src.exploration.text_analysis --help
# Tests: uv run python -m unittest discover -s tests -v
# Paths below are relative to THIS configuration file, not the current directory.

[dataset]
repo = "bakrianoo/jabarti-llm-dataset"
# Immutable revision resolved from the upstream repository during the audit.
# The original notebook did not record a revision; its results are historical.
revision = "7b7aeaaff76fdc254a9d245146c9d8a624bbd552"

[paths]
output_dir = "../outputs/data_exploration"
cache_dir = "../data/cache"

[analysis]
chars_per_token = 3.5
context_lengths = [512, 1024, 2048]
# Optional deterministic first-N preview; omit for complete splits.
# max_rows = 1000

# text_columns are pooled for character statistics and summed per row for
# approximate token counts. No tokenizer, truncation, or data mutation is used.
# Optional local_path overrides Hugging Face for that split; supported suffixes
# are .parquet, .jsonl, and .csv. Local paths are relative to this file.
[[splits]]
subset = "pretrain"
name = "phase1_train"
text_columns = ["text"]
duplicate_keys = ["article_id", "chunk_index"]

[[splits]]
subset = "pretrain"
name = "phase1_eval"
text_columns = ["text"]

[[splits]]
subset = "pretrain"
name = "phase2_train"
text_columns = ["text"]

[[splits]]
subset = "pretrain"
name = "phase2_eval"
text_columns = ["text"]

[[splits]]
subset = "finetune"
name = "train"
text_columns = ["question", "answer"]

[[splits]]
subset = "finetune"
name = "eval"
text_columns = ["question", "answer"]
