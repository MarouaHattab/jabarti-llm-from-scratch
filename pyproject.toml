[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jabarti-llm-from-scratch"
version = "0.1.0"
description = "Reproducible data exploration for an LLM built from scratch"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "datasets>=3,<6"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
