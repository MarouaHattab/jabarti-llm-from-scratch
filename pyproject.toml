[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jabarti-llm"
version = "0.1.0"
description = "A bilingual (Arabic + English) GPT, built from scratch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "tokenizers>=0.15",
    "pandas>=2.0",
    "pyarrow>=25.0.1",
    "tqdm>=4.66",
    "datasets>=5.0.1",
    "huggingface-hub>=1.27.0",
    "trackio>=0.34.0",
    "pytest>=7.0",
    "fastparquet>=2026.5.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
include = ["jabarti_llm*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
